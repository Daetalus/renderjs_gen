<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>A minimal login form with username, password, and a submit button.</title>
    <script src="./rsvp.js"></script>
    <script src="./renderjs.js"></script>
    <script src="./gadget_a-minimal-login-form-with-username-password-and-a-submit-button.js"></script>
  </head>
  <body>
    <div class="login-gadget-wrapper">
      <form class="login-form form" data-area="login_form">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" class="username-input input" data-area="username_input" placeholder="Username">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="password-input input" data-area="password_input" placeholder="Password">
        </div>
        <button type="submit" class="submit-btn button" data-area="submit_btn">Submit</button>
      </form>
      <div class="error-msg notice" data-area="error_msg"></div>
    </div>
  </body>
</html>
